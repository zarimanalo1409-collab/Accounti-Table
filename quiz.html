<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Accounting Quiz</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<nav>

    <div class="logo">
        📚 Accounti-Table
    </div>

    <div>

        <a href="index.html">Dashboard</a>
        <a href="lessons.html">Lessons</a>
        <a href="accounts.html">Account Titles</a>
        <a href="games.html">Games</a>
        <a href="quiz.html">Quiz</a>
        <a href="leaderboard.html">Leaderboard</a>

    </div>

</nav>


<section class="section">

    <div class="center">

        <span class="badge">
            ACCOUNTING QUIZ
        </span>

        <h2>
            📝 Test Your Knowledge
        </h2>

    </div>


    <div id="quizStart" class="quiz-box">

        <h3>
            Enter Your Name
        </h3>

        <p>
            Your score will be saved on
            the leaderboard.
        </p>

        <input
            type="text"
            id="quizPlayer"
            placeholder="Enter your name">

        <br>

        <button
            class="btn primary"
            onclick="startQuiz()">

            Start Quiz

        </button>

    </div>


    <div
        id="quizArea"
        class="quiz-box hidden">

        <p id="quizQuestionNumber"></p>

        <h3 id="quizQuestion"></h3>

        <div
            id="quizAnswers"
            class="answers">
        </div>

        <div
            id="quizFeedback"
            class="feedback">
        </div>

        <button
            id="quizNext"
            class="btn primary hidden"
            onclick="nextQuizQuestion()">

            Next →

        </button>

    </div>


    <div
        id="quizResult"
        class="quiz-box hidden">

        <h2>
            🎉 Quiz Complete!
        </h2>

        <h3 id="quizFinalScore"></h3>

        <a
            href="leaderboard.html"
            class="btn primary">

            View Leaderboard

        </a>

        <button
            class="btn"
            onclick="location.reload()">

            Try Again

        </button>

    </div>

</section>


<footer>

    <b>Accounti-Table Learning Hub</b>

</footer>


<script>

const quizQuestions = [

    {
        q:
        "Which equation represents the basic accounting equation?",

        a: [
            "Assets = Liabilities + Owner's Equity",
            "Assets = Revenue - Expenses",
            "Liabilities = Assets + Revenue",
            "Equity = Assets + Liabilities"
        ],

        c:
        "Assets = Liabilities + Owner's Equity"
    },


    {
        q:
        "Which of the following is an Asset?",

        a: [
            "Accounts Payable",
            "Cash",
            "Capital",
            "Loan Payable"
        ],

        c:
        "Cash"
    },


    {
        q:
        "Which account represents an obligation of the business?",

        a: [
            "Land",
            "Cash",
            "Accounts Payable",
            "Capital"
        ],

        c:
        "Accounts Payable"
    },


    {
        q:
        "The owner invests ₱25,000 cash into the business. What happens?",

        a: [
            "Assets increase and Owner's Equity increases",
            "Assets decrease and Liabilities increase",
            "Liabilities decrease and Equity decreases",
            "Assets remain unchanged"
        ],

        c:
        "Assets increase and Owner's Equity increases"
    },


    {
        q:
        "If Assets are ₱50,000 and Liabilities are ₱20,000, what is Owner's Equity?",

        a: [
            "₱70,000",
            "₱30,000",
            "₱20,000",
            "₱50,000"
        ],

        c:
        "₱30,000"
    },


    {
        q:
        "Which account is represented by the symbol AR?",

        a: [
            "Accounts Payable",
            "Accounts Receivable",
            "Accrued Revenue",
            "Asset Record"
        ],

        c:
        "Accounts Receivable"
    },


    {
        q:
        "Which account is represented by the symbol AP?",

        a: [
            "Accounts Payable",
            "Accounts Receivable",
            "Asset Payable",
            "Advance Payment"
        ],

        c:
        "Accounts Payable"
    },


    {
        q:
        "Which account represents the owner's investment?",

        a: [
            "Withdrawals",
            "Capital",
            "Accounts Payable",
            "Cash Expense"
        ],

        c:
        "Capital"
    },


    {
        q:
        "If Liabilities are ₱15,000 and Owner's Equity is ₱35,000, what are Assets?",

        a: [
            "₱20,000",
            "₱35,000",
            "₱50,000",
            "₱15,000"
        ],

        c:
        "₱50,000"
    },


    {
        q:
        "If Assets are ₱80,000 and Owner's Equity is ₱50,000, what are Liabilities?",

        a: [
            "₱30,000",
            "₱130,000",
            "₱50,000",
            "₱80,000"
        ],

        c:
        "₱30,000"
    }

];


let quizPlayer = "";

let quizQuestion = 0;

let quizScore = 0;

let quizAnswered = false;


function startQuiz() {

    quizPlayer =
        document
        .getElementById("quizPlayer")
        .value
        .trim();


    if (quizPlayer === "") {

        alert(
            "Please enter your name."
        );

        return;

    }


    quizQuestion = 0;

    quizScore = 0;


    document
        .getElementById("quizStart")
        .classList.add("hidden");


    document
        .getElementById("quizArea")
        .classList.remove("hidden");


    loadQuizQuestion();

}


function loadQuizQuestion() {

    quizAnswered = false;

    let q =
        quizQuestions[quizQuestion];


    document.getElementById(
        "quizQuestionNumber"
    ).textContent =
        "Question " +
        (quizQuestion + 1) +
        " of " +
        quizQuestions.length;


    document.getElementById(
        "quizQuestion"
    ).textContent =
        q.q;


    let answerBox =
        document.getElementById(
            "quizAnswers"
        );


    answerBox.innerHTML = "";


    q.a.forEach(function(answer) {

        let button =
            document.createElement("button");

        button.className =
            "answer";

        button.textContent =
            answer;

        button.onclick =
            function() {

                checkQuizAnswer(
                    button,
                    answer
                );

            };

        answerBox.appendChild(button);

    });


    document.getElementById(
        "quizFeedback"
    ).textContent = "";


    document.getElementById(
        "quizNext"
    ).classList.add("hidden");

}


function checkQuizAnswer(
    button,
    answer
) {

    if (quizAnswered) {
        return;
    }

    quizAnswered = true;


    let correct =
        quizQuestions[
            quizQuestion
        ].c;


    document
        .querySelectorAll(
            "#quizAnswers .answer"
        )
        .forEach(function(btn) {

            btn.disabled = true;

            if (
                btn.textContent === correct
            ) {

                btn.classList.add(
                    "correct"
                );

            }

        });


    if (answer === correct) {

        quizScore += 100;

        button.classList.add(
            "correct"
        );

        document.getElementById(
            "quizFeedback"
        ).textContent =
            "🎉 Correct! +100 points!";

    }

    else {

        button.classList.add(
            "wrong"
        );

        document.getElementById(
            "quizFeedback"
        ).textContent =
            "❌ Incorrect! Correct answer: "
            + correct;

    }


    document.getElementById(
        "quizNext"
    ).classList.remove(
        "hidden"
    );

}


function nextQuizQuestion() {

    quizQuestion++;


    if (
        quizQuestion <
        quizQuestions.length
    ) {

        loadQuizQuestion();

    }

    else {

        finishQuiz();

    }

}


function finishQuiz() {

    saveQuizScore();


    document
        .getElementById("quizArea")
        .classList.add("hidden");


    document
        .getElementById("quizResult")
        .classList.remove("hidden");


    document.getElementById(
        "quizFinalScore"
    ).textContent =
        quizPlayer +
        " scored " +
        quizScore +
        " / " +
        (quizQuestions.length * 100) +
        " points!";

}


function saveQuizScore() {

    let scores =
        JSON.parse(
            localStorage.getItem(
                "quizScores"
            ) || "[]"
        );


    scores.push({

        name: quizPlayer,

        score: quizScore,

        date:
            new Date()
            .toLocaleDateString()

    });


    scores.sort(function(a,b) {

        return b.score - a.score;

    });


    localStorage.setItem(
        "quizScores",
        JSON.stringify(
            scores.slice(0,20)
        )
    );

}

</script>


</body>
</html>
